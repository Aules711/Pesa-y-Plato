<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BEINGHEALTHY</title>
  <meta name="description" content="Tu plan de comidas ya puesto cada día. Escribe los gramos y la app calcula tus calorías y macros. Gratis.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BEINGHEALTHY">
  <meta property="og:title" content="BEINGHEALTHY · Tu dieta, al gramo">
  <meta property="og:description" content="Tu plan de comidas ya puesto cada día. Escribe los gramos y la app calcula tus calorías y macros. Gratis.">
  <meta property="og:image" content="https://pesayplato.vercel.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://pesayplato.vercel.app/">
  <meta property="og:locale" content="es_ES">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C1016" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BEINGHEALTHY">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
<div id="auth" class="auth" hidden></div>
<div id="app" hidden>
<main id="main" aria-live="polite"></main>
<div id="restbar" class="restbar" hidden>
  <div class="prog" id="restProg"></div>
  <span class="t"><span class="rl">Descanso</span><span id="restT">1:30</span><span class="nx" id="restNext"></span></span>
  <button data-act="rest-minus">−15</button><button data-act="rest-plus">+15</button><button data-act="rest-skip">Saltar</button>
</div>
<nav class="tabbar" id="tabbar" aria-label="Secciones">
  <button data-act="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hoy</button>
  <button data-act="tab" data-tab="food"><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2.5 1-4 3.5-4 7v3h4"/></svg>Diario</button>
  <button data-act="tab" data-tab="train"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Gym</button>
  <button data-act="tab" data-tab="nutri"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Nutrientes</button>
  <button data-act="tab" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</button>
  <button data-act="tab" data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</button>
</nav>
<button class="fab" id="fab" data-act="fab" aria-label="Registrar comida, peso o ejercicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-act="close"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h3 id="sheetTitle"></h3><button class="iconb" data-act="close" aria-label="Cerrar">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
